- name: configure backend server
  hosts: backend
  become: yes
  tasks:
  - name: disable current nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable nodejs:20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs,mysql-client
    ansible.builtin.package:
      name: "{{ item }}"
      state: installed
    loop:
    - nodejs
    - mysql

  - name: create expense user
    ansible.builtin.user:
      name: expense 

  - name: Create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: Download backend application code ##### SOURCE CODE
    ansible.builtin.get_url:
      url: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
      dest: /tmp/backend.zip

  - name: unzip application code
    ansible.builtin.unarchive:
      src: /tmp/backend.zip
      dest: /app
      remote_src: yes

  - name: Install dependencies
    community.general.npm:
      path: /app
  
  - name: Copy backend service file
    ansible.builtin.copy:
      src: /home/ec2-user/expense-ansible-sree/backend.service
      dest: /etc/systemd/system/backend.service

  - name: Import MYSQL schema into the database
    ansible.mysql.mysql_db:
      state: import
      name: all
      login_user: root
      login_password: ExpenseApp@1
      login_host: mysql.pavancloud5.online
      target: /app/schema/backend.sql


