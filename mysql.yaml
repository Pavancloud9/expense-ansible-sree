- name: configure mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: install mysql-server
    ansible.builtin.package:
      name: mysql-server
      state: installed

  - name: start and enable mysql-server service
    ansible.builtin.service:
      name: mysqld
      state: started
      enabled: yes
  
  - name: connect to mysql-server
    ansible.builtin.command: mysql -h mysql.pavancloud5.online -uroot -pExpenseApp@1
      # login_user: root
      # login_password: ExpenseApp@1
      # login_host: mysql.pavancloud5.online
    register: MYSQL-INFO

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ MYSQL-INFO }}"