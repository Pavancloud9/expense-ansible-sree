- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: install nginx
    ansible.builtin.package:
      name: nginx
      state: installed
  
  - name: enable nginx service
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes
    
  - name: Remove Nginx default site configuration
    ansible.builtin.file:
      path: /usr/share/nginx/html/
      state: absent